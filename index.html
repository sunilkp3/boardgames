<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #f3e5ab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #game-info {
      margin-bottom: 6px;
      text-align: center;
    }
    #status { margin: 2px 0; color: #3e2723; font-size: 20px; }
    #dice-result { margin: 2px 0; color: #5d4037; font-size: 14px; min-height: 20px; }
    
    .setup-panel {
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #efebe9;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #5d4037;
      width: 90vw;
      max-width: 350px;
      box-sizing: border-box;
    }
    .setup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-weight: bold;
      color: #3e2723;
    }
    .setup-row select, .setup-row input {
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #5d4037;
      background: #fff;
      color: #3e2723;
      width: 55%;
    }

    .board-container {
      padding: 24px;
      position: relative;
    }

    canvas {
      border: 4px solid #5d4037;
      background: #fff8e7;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      max-width: 82vw;
      max-height: 82vw;
      touch-action: none;
      display: block;
    }
    
    #coin-picker {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
    }
    .coin-btn {
      padding: 8px 12px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 6px;
      border: 2px solid #3e2723;
      background-color: #d7ccc8;
      color: #3e2723;
      cursor: pointer;
    }
    .coin-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      margin-top: 8px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #8d6e63;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px #5d4037;
      cursor: pointer;
    }
    .btn:active {
      box-shadow: 0 2px #5d4037;
      transform: translateY(2px);
    }
    .btn:disabled {
      background-color: #bcaaa4;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="setup-panel">
  <div class="setup-row">
    <label for="player-mode">Mode:</label>
    <select id="player-mode" onchange="changePlayerMode(this.value)">
      <option value="2">2 Players</option>
      <option value="4" selected>4 Players</option>
    </select>
  </div>
  
  <div id="name-inputs" style="width: 100%; display: flex; flex-direction: column; gap: 4px;"></div>
</div>

<div id="game-info">
  <h2 id="status">Turn: Player 1</h2>
  <h3 id="dice-result">Roll the Cowrie Shells!</h3>
</div>

<div class="board-container">
  <canvas id="board" width="350" height="350"></canvas>
</div>

<div id="coin-picker"></div>

<button id="roll-btn" class="btn" onclick="rollShells()">Roll Shells 🎲</button>

<script>
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  const GRID_SIZE = 5;
  const CELL_SIZE = canvas.width / GRID_SIZE;
  const SAFE_SQUARES = [2, 10, 12, 14, 22];
  const OUTER_RING_MAX_IDX = 15;
  const PATH_END_IDX = 24;

  const PLAYER_PATHS = {
    0: [ 2, 1, 0, 5,10,15,20,21,22,23,24,19,14, 9, 4, 3,   7, 8,13,18,17,16,11, 6, 12],
    1: [10,15,20,21,22,23,24,19,14, 9, 4, 3, 2, 1, 0, 5,  11, 6, 7, 8,13,18,17,16, 12],
    2: [22,23,24,19,14, 9, 4, 3, 2, 1, 0, 5,10,15,20,21,  17,16,11, 6, 7, 8,13,18, 12],
    3: [14, 9, 4, 3, 2, 1, 0, 5,10,15,20,21,22,23,24,19,  13,18,17,16,11, 6, 7, 8, 12]
  };

  const BASE_PLAYERS = [
    { id: 0, color: "#e53935", homeCell: 2,  labelPos: { x: 175, y: 372, align: "center" } }, // P1 (Bottom)
    { id: 1, color: "#fdd835", homeCell: 10, labelPos: { x: -16, y: 175, align: "right" } },  // P2 (Left)
    { id: 2, color: "#1e88e5", homeCell: 22, labelPos: { x: 175, y: -16, align: "center" } }, // P3 (Top)
    { id: 3, color: "#43a047", homeCell: 14, labelPos: { x: 366, y: 175, align: "left" } }    // P4 (Right)
  ];

  let activePlayers = [];
  let currentPlayerIdx = 0;
  let currentRoll = 0;
  let hasRolled = false;

  function changePlayerMode(mode) {
    if (mode === "2") {
      activePlayers = [
        { ...BASE_PLAYERS[0], name: "Player 1", coins: [0, 0, 0, 0], hasCut: false },
        { ...BASE_PLAYERS[2], name: "Player 2", coins: [0, 0, 0, 0], hasCut: false }
      ];
    } else {
      activePlayers = [
        { ...BASE_PLAYERS[0], name: "Player 1", coins: [0, 0, 0, 0], hasCut: false },
        { ...BASE_PLAYERS[1], name: "Player 2", coins: [0, 0, 0, 0], hasCut: false },
        { ...BASE_PLAYERS[2], name: "Player 3", coins: [0, 0, 0, 0], hasCut: false },
        { ...BASE_PLAYERS[3], name: "Player 4", coins: [0, 0, 0, 0], hasCut: false }
      ];
    }
    buildNameInputs();
    resetGame();
  }

  function buildNameInputs() {
    const container = document.getElementById("name-inputs");
    container.innerHTML = "";

    activePlayers.forEach((p, idx) => {
      const row = document.createElement("div");
      row.className = "setup-row";

      const label = document.createElement("label");
      label.style.color = p.color === "#fdd835" ? "#f57f17" : p.color;
      label.innerText = `P${idx + 1} Name:`;

      const input = document.createElement("input");
      input.type = "text";
      input.value = p.name;
      input.oninput = (e) => updatePlayerName(idx, e.target.value);

      row.appendChild(label);
      row.appendChild(input);
      container.appendChild(row);
    });
  }

  function updatePlayerName(idx, newName) {
    activePlayers[idx].name = newName || `Player ${idx + 1}`;
    document.getElementById("status").innerText = `Turn: ${activePlayers[currentPlayerIdx].name}`;
    drawBoard();
  }

  function resetGame() {
    activePlayers.forEach(p => {
      p.coins = [0, 0, 0, 0];
      p.hasCut = false;
    });
    currentPlayerIdx = 0;
    hasRolled = false;
    document.getElementById("roll-btn").disabled = false;
    document.getElementById("dice-result").innerText = "Roll the Cowrie Shells!";
    document.getElementById("status").innerText = `Turn: ${activePlayers[currentPlayerIdx].name}`;
    document.getElementById("coin-picker").innerHTML = "";
    drawBoard();
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Grid Lines & Safe Crosses
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const x = col * CELL_SIZE;
        const y = row * CELL_SIZE;
        const cellId = row * GRID_SIZE + col;

        ctx.strokeStyle = "#5d4037";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

        if (SAFE_SQUARES.includes(cellId)) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + CELL_SIZE, y + CELL_SIZE);
          ctx.moveTo(x + CELL_SIZE, y);
          ctx.lineTo(x, y + CELL_SIZE);
          ctx.strokeStyle = "#d7ccc8";
          ctx.stroke();
        }
      }
    }

    // 2. Draw Player Names OUTSIDE below/around board
    activePlayers.forEach((p) => {
      ctx.fillStyle = p.color === "#fdd835" ? "#f57f17" : p.color;
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = p.labelPos.align;
      ctx.textBaseline = "middle";
      ctx.fillText(p.name, p.labelPos.x, p.labelPos.y);
    });

    // 3. Gather Cell Occupants
    const cellOccupants = {};
    activePlayers.forEach((p, pIdx) => {
      p.coins.forEach((pathIdx, coinIdx) => {
        const cellId = PLAYER_PATHS[p.id][pathIdx];
        if (!cellOccupants[cellId]) cellOccupants[cellId] = [];
        cellOccupants[cellId].push({ 
          player: p, 
          pTag: `P${pIdx + 1}`, 
          coinNum: coinIdx + 1 
        });
      });
    });

    // 4. Render Coin Badges with UX Grid Layout for Overlapping Players
    for (const [cellId, occupants] of Object.entries(cellOccupants)) {
      const col = cellId % GRID_SIZE;
      const row = Math.floor(cellId / GRID_SIZE);
      const cellCenterX = col * CELL_SIZE + CELL_SIZE / 2;
      const cellCenterY = row * CELL_SIZE + CELL_SIZE / 2;

      // Group coins by player
      const pGroups = {};
      occupants.forEach(occ => {
        const pid = occ.player.id;
        if (!pGroups[pid]) {
          pGroups[pid] = { 
            player: occ.player, 
            pTag: occ.pTag, 
            coinNums: [] 
          };
        }
        pGroups[pid].coinNums.push(occ.coinNum);
      });

      const uniquePlayers = Object.values(pGroups);
      const numPlayers = uniquePlayers.length;

      // Layout positioning depending on how many different players share the cell
      uniquePlayers.forEach((group, idx) => {
        let cx = cellCenterX;
        let cy = cellCenterY;
        let radius = CELL_SIZE / 4;

        if (numPlayers === 2) {
          radius = CELL_SIZE / 4.2;
          const shift = CELL_SIZE / 5.2;
          cx += (idx === 0 ? -shift : shift);
          cy += (idx === 0 ? -shift : shift);
        } else if (numPlayers >= 3) {
          radius = CELL_SIZE / 5.2;
          const shift = CELL_SIZE / 5.5;
          cx += (idx % 2 === 0 ? -shift : shift);
          cy += (idx < 2 ? -shift : shift);
        } else {
          // Single player on cell
          if (group.coinNums.length > 1) radius = CELL_SIZE / 3.4;
        }

        // Draw Badge Base with Drop Shadow
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = group.player.color;
        ctx.fill();
        ctx.restore();

        // Border highlighting unlocked inner-ring access
        ctx.lineWidth = 2;
        ctx.strokeStyle = group.player.hasCut ? "#FFD700" : "#3e2723";
        ctx.stroke();

        // Label Formatting: e.g. "P1:C1,2"
        const sortedCoins = group.coinNums.sort((a, b) => a - b).join(",");
        const labelText = numPlayers >= 3 ? `${group.pTag}:${sortedCoins}` : `${group.pTag}:C${sortedCoins}`;

        ctx.fillStyle = group.player.color === "#fdd835" ? "#000" : "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Dynamic Font Size
        if (labelText.length > 8) {
          ctx.font = "bold 6.5px sans-serif";
        } else if (labelText.length > 6) {
          ctx.font = "bold 7.5px sans-serif";
        } else {
          ctx.font = "bold 8.5px sans-serif";
        }

        ctx.fillText(labelText, cx, cy);
      });
    }
  }

  function rollShells() {
    if (hasRolled) return;

    const dicePool = [1, 2, 3, 4, 8];
    currentRoll = dicePool[Math.floor(Math.random() * dicePool.length)];

    document.getElementById("dice-result").innerText = `Rolled: ${currentRoll}`;
    hasRolled = true;
    document.getElementById("roll-btn").disabled = true;

    renderCoinPicker();
  }

  function renderCoinPicker() {
    const p = activePlayers[currentPlayerIdx];
    const pickerDiv = document.getElementById("coin-picker");
    pickerDiv.innerHTML = "";

    p.coins.forEach((pathIdx, coinIdx) => {
      const btn = document.createElement("button");
      btn.className = "coin-btn";

      const projectedIdx = pathIdx + currentRoll;

      if (pathIdx === PATH_END_IDX) {
        btn.innerText = `Coin ${coinIdx + 1} (Finished)`;
        btn.disabled = true;
      } else if (!p.hasCut && projectedIdx > OUTER_RING_MAX_IDX) {
        btn.innerText = `Coin ${coinIdx + 1} (Blocked - Need Capture)`;
        btn.disabled = true;
      } else {
        btn.innerText = `Move Coin ${coinIdx + 1}`;
        btn.onclick = () => selectCoinToMove(coinIdx);
      }
      pickerDiv.appendChild(btn);
    });

    const hasValidMove = Array.from(pickerDiv.children).some(b => !b.disabled);
    if (!hasValidMove) {
      document.getElementById("dice-result").innerText += ` — No valid moves! Passing turn.`;
      setTimeout(passTurn, 1400);
    }
  }

  function selectCoinToMove(coinIdx) {
    const p = activePlayers[currentPlayerIdx];
    let extraTurn = false;
    let targetIdx = p.coins[coinIdx] + currentRoll;

    if (targetIdx <= PATH_END_IDX) {
      p.coins[coinIdx] = targetIdx;
      const landingCell = PLAYER_PATHS[p.id][targetIdx];

      // Collision check on unsafe squares
      if (!SAFE_SQUARES.includes(landingCell)) {
        activePlayers.forEach((other) => {
          if (other.id !== p.id) {
            other.coins.forEach((otherPathIdx, oCoinIdx) => {
              const otherCell = PLAYER_PATHS[other.id][otherPathIdx];
              if (otherCell === landingCell && otherPathIdx < PATH_END_IDX) {
                other.coins[oCoinIdx] = 0;
                p.hasCut = true;
                extraTurn = true;
                document.getElementById("dice-result").innerText += ` — Captured ${other.name}'s Coin ${oCoinIdx + 1}! 💥`;
              }
            });
          }
        });
      }
    }

    const hasWon = p.coins.every(idx => idx === PATH_END_IDX);
    if (hasWon) {
      document.getElementById("status").innerText = `🎉 ${p.name} WINS THE GAME! 🎉`;
      document.getElementById("coin-picker").innerHTML = "";
      drawBoard();
      return;
    }

    if (currentRoll === 4 || currentRoll === 8) {
      extraTurn = true;
    }

    drawBoard();
    document.getElementById("coin-picker").innerHTML = "";

    if (!extraTurn) {
      passTurn();
    } else {
      document.getElementById("status").innerText = `${activePlayers[currentPlayerIdx].name} gets another turn! 🎲`;
      hasRolled = false;
      document.getElementById("roll-btn").disabled = false;
    }
  }

  function passTurn() {
    currentPlayerIdx = (currentPlayerIdx + 1) % activePlayers.length;
    document.getElementById("status").innerText = `Turn: ${activePlayers[currentPlayerIdx].name}`;
    document.getElementById("coin-picker").innerHTML = "";
    hasRolled = false;
    document.getElementById("roll-btn").disabled = false;
  }

  changePlayerMode("4");
</script>

</body>
</html>
