<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238d6e63'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='32'%3E🎲%3C/text%3E%3C/svg%3E">
  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #f3e5ab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #game-info {
      margin-bottom: 6px;
      text-align: center;
    }
    #status { margin: 2px 0; color: #3e2723; font-size: 18px; }
    #dice-result { margin: 2px 0; color: #5d4037; font-size: 15px; font-weight: bold; min-height: 20px; }
    
    .room-panel {
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #efebe9;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #5d4037;
      width: 90vw;
      max-width: 350px;
      box-sizing: border-box;
    }
    .room-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
    }
    .room-row input, .room-row button, .room-row select {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #5d4037;
    }

    .board-container {
      padding: 24px;
      position: relative;
    }

    canvas {
      border: 4px solid #5d4037;
      background: #fff8e7;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      max-width: 82vw;
      max-height: 82vw;
      touch-action: none;
      display: block;
    }
    
    #coin-picker {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
    }
    .coin-btn {
      padding: 8px 12px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 6px;
      border: 2px solid #3e2723;
      background-color: #d7ccc8;
      color: #3e2723;
      cursor: pointer;
    }
    .coin-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      margin-top: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: #8d6e63;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px #5d4037;
      cursor: pointer;
    }
    .btn:disabled {
      background-color: #bcaaa4;
      box-shadow: none;
      cursor: not-allowed;
    }
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dice-anim {
      margin: 8px 0 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 92px;
    }

    .dice-face {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fff8e1, #ffe082);
      border: 2px solid #5d4037;
      display: grid;
      place-items: center;
      font-size: 32px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }

    .dice-face.rolling {
      animation: dice-spin 0.45s linear infinite;
    }

    .dice-caption {
      color: #5d4037;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }

    .board-roll-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
      font-size: 54px;
      font-weight: bold;
      color: #3e2723;
      text-shadow: 0 3px 6px rgba(255,255,255,0.9);
    }

    @keyframes dice-spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
  </style>

  <!-- PeerJS Cloud Library (Free P2P WebRTC) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="room-panel" id="lobby-panel">
  <div class="room-row">
    <input type="text" id="player-name" placeholder="Your Name" style="width: 50%;">
    <input type="text" id="room-code-input" placeholder="Room Code" style="width: 45%;">
  </div>

  <!-- Host-Only Mode Control Row -->
  <div class="room-row" id="host-mode-row" style="display: none;">
    <label for="max-players-select" style="color: #3e2723; font-weight: bold; font-size: 13px;">Game Mode:</label>
    <select id="max-players-select" onchange="updateMaxPlayers(this.value)" style="width: 55%;">
      <option value="2">2 Players (Opposite Seats)</option>
      <option value="4" selected>4 Players (All Seats)</option>
    </select>
  </div>

  <div class="room-row" style="justify-content: center; gap: 8px;">
    <button id="host-btn" onclick="hostGame()" style="background:#8d6e63; color:#fff;">Host Game 👑</button>
    <button id="join-btn" onclick="joinGame()" style="background:#d7ccc8; color:#3e2723;">Join Game 🚪</button>
    <button id="share-btn" onclick="shareRoomLink()" style="display: none; background:#2e7d32; color:#fff;">Share Link 🔗</button>
  </div>
  <div class="room-row" style="justify-content: center;">
    <button id="clear-storage-btn" onclick="clearThisSiteStorage()" style="background:#6d4c41; color:#fff;">Clear Saved Game Data 🧹</button>
  </div>
</div>

<div class="dice-anim">
  <div id="dice-face" class="dice-face">🎲</div>
  <div id="dice-caption" class="dice-caption">Waiting for room connection...</div>
</div>

<div id="game-info">
  <h2 id="status">Host or Join a game!</h2>
  <h3 id="dice-result">Waiting for room connection...</h3>
</div>

<div class="board-container">
  <canvas id="board" width="350" height="350"></canvas>
  <div id="board-roll-overlay" class="board-roll-overlay">🎲</div>
</div>

<div id="coin-picker"></div>

<div class="action-row">
  <button id="start-btn" class="btn" onclick="startGame()" style="display: none; background-color: #2e7d32;">Start Game 🚀</button>
  <button id="roll-btn" class="btn" onclick="requestRoll()" disabled>Roll Shells 🎲</button>
  <button id="restart-btn" class="btn" onclick="requestRestart()" style="display: none; background-color: #ff9800;">Restart 🔄</button>
  <button id="end-btn" class="btn" onclick="requestEndGame()" style="display: none; background-color: #c62828;">End Game 🛑</button>
  <button id="leave-btn" class="btn" onclick="leaveSession()" style="display: none; background-color: #757575;">Leave Room 🚪</button>
</div>

<script>
  // Persistent Device Fingerprint
  function getOrCreateDeviceId() {
    if (window.AndroidBridge) {
      return window.AndroidBridge.getDeviceId();
    }
    let savedId = localStorage.getItem("chowka_device_id");
    if (!savedId) {
      savedId = "DEV_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("chowka_device_id", savedId);
    }
    return savedId;
  }

  const myDeviceId = getOrCreateDeviceId();
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  const GRID_SIZE = 5;
  const CELL_SIZE = canvas.width / GRID_SIZE;
  const SAFE_SQUARES = [2, 10, 12, 14, 22];
  const OUTER_RING_MAX_IDX = 15;
  const PATH_END_IDX = 24;

  const PLAYER_PATHS = {
    0: [ 2, 1, 0, 5, 10, 15, 20, 21, 22, 23, 24, 19, 14, 9, 4, 3,   6, 11, 16, 17, 18, 13, 8, 7, 12],
    1: [10, 15, 20, 21, 22, 23, 24, 19, 14, 9, 4, 3, 2, 1, 0, 5,  16, 17, 18, 13, 8, 7, 6, 11, 12],
    2: [22, 23, 24, 19, 14, 9, 4, 3, 2, 1, 0, 5, 10, 15, 20, 21,  18, 13, 8, 7, 6, 11, 16, 17, 12],
    3: [14, 9, 4, 3, 2, 1, 0, 5, 10, 15, 20, 21, 22, 23, 24, 19,   8, 7, 6, 11, 16, 17, 18, 13, 12]
  };

  const BASE_PLAYERS = [
    { id: 0, color: "#e53935", labelPos: { x: 175, y: 372, align: "center" } },
    { id: 1, color: "#fdd835", labelPos: { x: -16, y: 175, align: "right" } },
    { id: 2, color: "#1e88e5", labelPos: { x: 175, y: -16, align: "center" } },
    { id: 3, color: "#43a047", labelPos: { x: 366, y: 175, align: "left" } }
  ];

  const peerConfig = {
    host: "0.peerjs.com",
    port: 443,
    secure: true,
    path: "/",
    debug: 0,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    }
  };

  let peer = null;
  let isHost = false;
  let connectionsMap = {}; // Maps deviceId -> connection
  let hostConn = null;
  let currentRoomCode = "";
  let rollAnimationTimer = null;

  let gameState = {
    status: "lobby",
    maxPlayers: 4,
    players: [],
    currentPlayerIdx: 0,
    currentRoll: 0,
    hasRolled: false,
    lastRollerName: "",
    rollAnimationActive: false,
    rollAnimationValue: 0,
    rollAnimationPlayerName: ""
  };

  window.addEventListener("DOMContentLoaded", () => {
    // Check if there is an active session stored in localStorage to resume
    const savedRoom = localStorage.getItem("chowka_active_room");
    const savedRole = localStorage.getItem("chowka_role");
    const savedName = localStorage.getItem("chowka_player_name");

    if (savedRoom && savedRole && savedName) {
      document.getElementById("room-code-input").value = savedRoom;
      document.getElementById("player-name").value = savedName;
      
      document.getElementById("status").innerText = "Resuming previous session...";
      if (savedRole === "host") {
        resumeHostSession(savedRoom, savedName);
      } else {
        resumeGuestSession(savedRoom, savedName);
      }
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get("room");
    if (roomParam) {
      document.getElementById("room-code-input").value = roomParam;
      document.getElementById("host-btn").style.display = "none";
      document.getElementById("status").innerText = `Room ${roomParam} loaded! Enter a name and click Join Game.`;
    }
  });

  function saveSession(roomCode, role, name) {
    localStorage.setItem("chowka_active_room", roomCode);
    localStorage.setItem("chowka_role", role);
    localStorage.setItem("chowka_player_name", name);

    const leaveBtn = document.getElementById("leave-btn");
    if (leaveBtn && leaveBtn.style) leaveBtn.style.display = "inline-block";
  }

  function clearGameStorage() {
    const keys = ["chowka_active_room", "chowka_role", "chowka_player_name", "chowka_saved_gamestate", "chowka_device_id"];
    keys.forEach((key) => localStorage.removeItem(key));
  }

  function clearThisSiteStorage() {
    clearGameStorage();
    if (confirm("This will clear the saved room and game data for this site on this device. Continue?")) {
      clearGameStorage();
      if (typeof window.location !== "undefined") {
        window.location.reload();
      }
    }
  }

  function cleanupNetworking() {
    try {
      if (hostConn && typeof hostConn.close === "function") hostConn.close();
    } catch (e) {}
    try {
      if (peer && typeof peer.destroy === "function") peer.destroy();
    } catch (e) {}
    hostConn = null;
    peer = null;
    connectionsMap = {};
  }

  function leaveSession() {
    clearGameStorage();
    cleanupNetworking();
    location.href = window.location.pathname; // Hard refresh to clean slate
  }

  function hostGame() {
    const name = document.getElementById("player-name").value.trim();
    if (!name) {
      alert("Please enter a name before hosting!");
      return;
    }
    currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById("room-code-input").value = currentRoomCode;
    initHostPeer(currentRoomCode, name, false);
  }

  function resumeHostSession(roomCode, name) {
    // Check for saved gameState on host side
    const savedStateStr = localStorage.getItem("chowka_saved_gamestate");
    if (savedStateStr) {
      try { gameState = JSON.parse(savedStateStr); } catch(e){}
    }
    currentRoomCode = roomCode;
    initHostPeer(roomCode, name, true);
  }

  function initHostPeer(roomCode, name, isResume) {
    if (typeof window.Peer !== "function") {
      alert("The multiplayer service did not load. Please refresh the page and try again.");
      return;
    }

    isHost = true;
    saveSession(roomCode, "host", name);

    const hostModeRow = document.getElementById("host-mode-row");
    if (hostModeRow && hostModeRow.style) hostModeRow.style.display = gameState.status === "lobby" ? "flex" : "none";

    const hostBtn = document.getElementById("host-btn");
    if (hostBtn && hostBtn.style) hostBtn.style.display = "none";

    const joinBtn = document.getElementById("join-btn");
    if (joinBtn && joinBtn.style) joinBtn.style.display = "none";

    const shareBtn = document.getElementById("share-btn");
    if (shareBtn && shareBtn.style) shareBtn.style.display = "inline-block";

    const restartBtn = document.getElementById("restart-btn");
    if (restartBtn && restartBtn.style) restartBtn.style.display = "inline-block";

    const endBtn = document.getElementById("end-btn");
    if (endBtn && endBtn.style) endBtn.style.display = "inline-block";

    peer = new Peer("CHOWKA_" + roomCode, peerConfig);

    peer.on("open", () => {
      if (!isResume || gameState.players.length === 0) {
        gameState.players = [{
          id: 0,
          seatIdx: 0,
          deviceId: myDeviceId,
          name: name,
          color: BASE_PLAYERS[0].color,
          coins: [0, 0, 0, 0],
          hasCut: false
        }];
      } else {
        // Ensure Host deviceId matches
        const hostP = gameState.players.find(p => p.seatIdx === 0);
        if (hostP) hostP.deviceId = myDeviceId;
      }

      if (gameState.status === "lobby") {
        document.getElementById("start-btn").style.display = "inline-block";
      }

      broadcastState();
    });

    peer.on("connection", (conn) => {
      conn.on("open", () => {
        conn.send({ type: "SYNC_STATE", state: gameState });
      });
      conn.on("data", (data) => handleHostIncomingData(conn, data));
      conn.on("error", (err) => console.error("Host connection error:", err));
    });

    peer.on("error", (err) => {
      console.error("Peer error:", err);
      document.getElementById("status").innerText = `Connection issue: ${err.message || err.type}`;
    });

    peer.on("disconnected", () => {
      peer.reconnect();
    });
  }

  function joinGame() {
    const name = document.getElementById("player-name").value.trim();
    const roomCode = document.getElementById("room-code-input").value.trim();

    if (!name || !roomCode) {
      alert("Please enter both your name and a Room Code!");
      return;
    }
    initGuestPeer(roomCode, name, false);
  }

  function resumeGuestSession(roomCode, name) {
    initGuestPeer(roomCode, name, true);
  }

  function initGuestPeer(roomCode, name, isResume) {
    if (typeof window.Peer !== "function") {
      alert("The multiplayer service did not load. Please refresh the page and try again.");
      return;
    }

    isHost = false;
    currentRoomCode = roomCode;
    saveSession(roomCode, "guest", name);

    const hostBtn = document.getElementById("host-btn");
    if (hostBtn && hostBtn.style) hostBtn.style.display = "none";

    const joinBtn = document.getElementById("join-btn");
    if (joinBtn) joinBtn.disabled = true;

    peer = new Peer(undefined, peerConfig);
    peer.on("open", () => {
      hostConn = peer.connect("CHOWKA_" + roomCode, { reliable: true });

      hostConn.on("open", () => {
        const reqType = isResume ? "RECONNECT_REQUEST" : "JOIN_REQUEST";
        hostConn.send({ type: reqType, name: name, deviceId: myDeviceId });
      });

      hostConn.on("data", (data) => {
        if (data.type === "SYNC_STATE") {
          gameState = data.state;
          drawBoard();
          updateUI();
        } else if (data.type === "REJECTED") {
          alert(data.reason);
          const joinBtn = document.getElementById("join-btn");
          if (joinBtn) joinBtn.disabled = false;
        } else if (data.type === "ROOM_CLEARED") {
          clearGameStorage();
          cleanupNetworking();
          setTimeout(() => {
            location.href = window.location.pathname;
          }, 250);
        }
      });

      hostConn.on("error", (err) => {
        console.error("Host connection error:", err);
        document.getElementById("status").innerText = `Connection issue: ${err.message || err.type}`;
        const joinBtn = document.getElementById("join-btn");
        if (joinBtn) joinBtn.disabled = false;
      });
    });

    peer.on("error", (err) => {
      console.error("Peer error:", err);
      document.getElementById("status").innerText = `Connection issue: ${err.message || err.type}`;
      const joinBtn = document.getElementById("join-btn");
      if (joinBtn) joinBtn.disabled = false;
    });

    peer.on("disconnected", () => {
      peer.reconnect();
    });
  }

  function handleHostIncomingData(conn, data) {
    // 1. HANDLE RECONNECT REQUEST (RESUME)
    if (data.type === "RECONNECT_REQUEST") {
      const existingPlayer = gameState.players.find(p => p.deviceId === data.deviceId);
      if (existingPlayer) {
        existingPlayer.name = data.name; // Sync name in case it changed
        connectionsMap[data.deviceId] = conn;
        conn.send({ type: "SYNC_STATE", state: gameState });
        broadcastState();
        return;
      } else {
        // Fallback to join if player wasn't found
        data.type = "JOIN_REQUEST";
      }
    }

    // 2. HANDLE NEW JOIN REQUEST
    if (data.type === "JOIN_REQUEST") {
      const alreadyInRoom = gameState.players.some(p => p.deviceId === data.deviceId);
      if (alreadyInRoom) {
        // Re-link connection socket if already present
        connectionsMap[data.deviceId] = conn;
        conn.send({ type: "SYNC_STATE", state: gameState });
        return;
      }

      const nameExists = gameState.players.some(p => p.name.trim().toLowerCase() === data.name.trim().toLowerCase());
      if (nameExists) {
        conn.send({ type: "REJECTED", reason: `The name "${data.name}" is already taken! Choose another.` });
        return;
      }

      if (gameState.status !== "lobby") {
        conn.send({ type: "REJECTED", reason: "Game in progress! Cannot join as a new player." });
        return;
      }
      if (gameState.players.length >= gameState.maxPlayers) {
        conn.send({ type: "REJECTED", reason: `Room full (${gameState.maxPlayers}-Player mode)!` });
        return;
      }

      const pCount = gameState.players.length;
      const seatIdx = (gameState.maxPlayers === 2 && pCount === 1) ? 2 : pCount;

      gameState.players.push({
        id: pCount,
        seatIdx: seatIdx,
        deviceId: data.deviceId,
        name: data.name,
        color: BASE_PLAYERS[seatIdx].color,
        coins: [0, 0, 0, 0],
        hasCut: false
      });

      connectionsMap[data.deviceId] = conn;
      broadcastState();
    } 
    else if (data.type === "ACTION_ROLL") {
      if (gameState.status === "in_progress" && gameState.players[gameState.currentPlayerIdx].deviceId === data.deviceId) {
        executeRoll();
      }
    } 
    else if (data.type === "ACTION_MOVE") {
      if (gameState.status === "in_progress" && gameState.players[gameState.currentPlayerIdx].deviceId === data.deviceId) {
        executeMove(data.coinIdx);
      }
    }
  }

  function broadcastToPeers(message) {
    if (!isHost) return;
    Object.values(connectionsMap).forEach((conn) => {
      if (conn && conn.open) {
        conn.send(message);
      }
    });
  }

  function startGame() {
    if (!isHost) return;
    
    if (gameState.players.length < gameState.maxPlayers) {
      alert(`Waiting for ${gameState.maxPlayers} players to join before starting!`);
      return;
    }

    gameState.status = "in_progress";
    gameState.currentPlayerIdx = 0;
    gameState.hasRolled = false;
    gameState.currentRoll = 0;
    gameState.lastRollerName = "";

    document.getElementById("start-btn").style.display = "none";
    document.getElementById("host-mode-row").style.display = "none";
    document.getElementById("share-btn").style.display = "none";
    broadcastState();
  }

  function requestRestart() {
    if (isHost) {
      resetGameData();
    }
  }

  function requestEndGame() {
    if (!isHost) return;

    clearGameStorage();
    gameState.status = "ended";
    gameState.currentPlayerIdx = 0;
    gameState.currentRoll = 0;
    gameState.hasRolled = false;
    gameState.lastRollerName = "";
    gameState.rollAnimationActive = false;
    gameState.rollAnimationValue = 0;
    gameState.rollAnimationPlayerName = "";

    broadcastToPeers({ type: "ROOM_CLEARED" });
    cleanupNetworking();
    document.getElementById("status").innerText = "Game ended by host. Clearing room...";
    document.getElementById("dice-result").innerText = "Room is being reset for everyone.";

    setTimeout(() => {
      location.href = window.location.pathname;
    }, 400);
  }

  function resetGameData() {
    gameState.status = "lobby";
    gameState.currentPlayerIdx = 0;
    gameState.currentRoll = 0;
    gameState.hasRolled = false;
    gameState.lastRollerName = "";
    gameState.rollAnimationActive = false;
    gameState.rollAnimationValue = 0;
    gameState.rollAnimationPlayerName = "";

    gameState.players.forEach(p => {
      p.coins = [0, 0, 0, 0];
      p.hasCut = false;
    });

    if (isHost) {
      document.getElementById("start-btn").style.display = "inline-block";
      document.getElementById("host-mode-row").style.display = "flex";
      document.getElementById("share-btn").style.display = "inline-block";
      document.getElementById("end-btn").style.display = "inline-block";
      document.getElementById("roll-btn").disabled = true;
      broadcastState();
    }
  }

  function broadcastState() {
    drawBoard();
    updateUI();

    if (isHost) {
      // Host saves master state locally
      localStorage.setItem("chowka_saved_gamestate", JSON.stringify(gameState));

      const msg = { type: "SYNC_STATE", state: gameState };
      Object.values(connectionsMap).forEach(conn => {
        if (conn && conn.open) {
          conn.send(msg);
        }
      });
    }
  }

  function requestRoll() {
    if (gameState.status !== "in_progress") return;

    if (isHost) {
      if (gameState.players[gameState.currentPlayerIdx].deviceId === myDeviceId) {
        executeRoll();
      }
    } else {
      hostConn.send({ type: "ACTION_ROLL", deviceId: myDeviceId });
    }
  }

  function getDiceSymbol(value) {
    const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
    return faces[Math.max(0, Math.min(5, value - 1))] || "🎲";
  }

  function updateDiceDisplay() {
    const faceEl = document.getElementById("dice-face");
    const captionEl = document.getElementById("dice-caption");
    const overlayEl = document.getElementById("board-roll-overlay");
    const activePlayer = gameState.players[gameState.currentPlayerIdx];

    if (gameState.rollAnimationActive) {
      faceEl.classList.add("rolling");
      faceEl.innerText = getDiceSymbol(gameState.rollAnimationValue || 1);
      captionEl.innerText = `${gameState.rollAnimationPlayerName || activePlayer?.name || "Player"} is rolling...`;
      if (overlayEl) {
        overlayEl.style.display = "flex";
        overlayEl.innerText = getDiceSymbol(gameState.rollAnimationValue || 1);
      }
      return;
    }

    faceEl.classList.remove("rolling");

    if (overlayEl) overlayEl.style.display = "none";

    if (gameState.currentRoll > 0) {
      faceEl.innerText = getDiceSymbol(gameState.currentRoll);
      captionEl.innerText = `${gameState.lastRollerName || activePlayer?.name || "Player"} rolled ${gameState.currentRoll}`;
    } else {
      faceEl.innerText = "🎲";
      captionEl.innerText = activePlayer ? `Waiting for ${activePlayer.name} to roll...` : "Waiting for room connection...";
    }
  }

  function executeRoll() {
    if (gameState.hasRolled || gameState.rollAnimationActive) return;

    const dicePool = [1, 2, 3, 4, 8];
    const activePlayer = gameState.players[gameState.currentPlayerIdx];
    const finalRoll = dicePool[Math.floor(Math.random() * dicePool.length)];

    gameState.currentRoll = 0;
    gameState.hasRolled = false;
    gameState.lastRollerName = activePlayer.name;
    gameState.rollAnimationActive = true;
    gameState.rollAnimationValue = 1;
    gameState.rollAnimationPlayerName = activePlayer.name;

    if (isHost) broadcastState();

    if (rollAnimationTimer) clearInterval(rollAnimationTimer);

    let frame = 0;
    const totalFrames = 20;
    rollAnimationTimer = setInterval(() => {
      frame += 1;
      const animatedValue = [1, 2, 3, 4, 5, 6][(frame + Math.floor(Math.random() * 2)) % 6];
      gameState.rollAnimationValue = animatedValue;
      updateDiceDisplay();

      if (frame >= totalFrames) {
        clearInterval(rollAnimationTimer);
        rollAnimationTimer = null;
        gameState.currentRoll = finalRoll;
        gameState.hasRolled = true;
        gameState.rollAnimationActive = false;
        gameState.rollAnimationValue = finalRoll;
        updateDiceDisplay();
        if (isHost) broadcastState();
      }
    }, 100);
  }

  function selectCoinToMove(coinIdx) {
    if (gameState.status !== "in_progress") return;

    if (isHost) {
      if (gameState.players[gameState.currentPlayerIdx].deviceId === myDeviceId) {
        executeMove(coinIdx);
      }
    } else {
      hostConn.send({ type: "ACTION_MOVE", coinIdx: coinIdx, deviceId: myDeviceId });
    }
  }

  function executeMove(coinIdx) {
    const activePlayer = gameState.players[gameState.currentPlayerIdx];
    let extraTurn = false;
    let targetIdx = activePlayer.coins[coinIdx] + gameState.currentRoll;

    if (targetIdx <= PATH_END_IDX) {
      activePlayer.coins[coinIdx] = targetIdx;
      const landingCell = PLAYER_PATHS[activePlayer.seatIdx][targetIdx];

      if (!SAFE_SQUARES.includes(landingCell)) {
        gameState.players.forEach((other) => {
          if (other.id !== activePlayer.id) {
            other.coins.forEach((otherPathIdx, oCoinIdx) => {
              const otherCell = PLAYER_PATHS[other.seatIdx][otherPathIdx];
              if (otherCell === landingCell && otherPathIdx < PATH_END_IDX) {
                other.coins[oCoinIdx] = 0;
                activePlayer.hasCut = true;
                extraTurn = true;
              }
            });
          }
        });
      }
    }

    const hasWon = activePlayer.coins.every(idx => idx === PATH_END_IDX);
    if (hasWon) {
      gameState.status = "won";
      if (isHost) broadcastState();
      return;
    }

    if (gameState.currentRoll === 4 || gameState.currentRoll === 8) {
      extraTurn = true;
    }

    if (!extraTurn) {
      gameState.currentPlayerIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length;
    }

    gameState.currentRoll = 0;
    gameState.hasRolled = false;
    gameState.rollAnimationActive = false;
    gameState.rollAnimationValue = 0;
    gameState.rollAnimationPlayerName = "";

    if (isHost) broadcastState();
  }

  function updateUI() {
    if (!gameState.players || gameState.players.length === 0) return;

    const activePlayer = gameState.players[gameState.currentPlayerIdx];
    const isMyTurn = activePlayer ? activePlayer.deviceId === myDeviceId : false;

    if (gameState.status === "lobby") {
      document.getElementById("status").innerText = `Mode: ${gameState.maxPlayers} Players | Joined: ${gameState.players.length}/${gameState.maxPlayers}`;
      document.getElementById("dice-result").innerText = isHost ? "Waiting for players, then press Start!" : "Waiting for Host to start...";
      updateDiceDisplay();
      document.getElementById("roll-btn").disabled = true;
      document.getElementById("coin-picker").innerHTML = "";
      return;
    }

    if (gameState.status === "won") {
      document.getElementById("status").innerText = `🎉 ${activePlayer.name} WINS THE GAME! 🎉`;
      document.getElementById("dice-result").innerText = `🎉 ${activePlayer.name} won the match!`;
      updateDiceDisplay();
      document.getElementById("roll-btn").disabled = true;
      document.getElementById("coin-picker").innerHTML = "";
      return;
    }

    document.getElementById("status").innerText = `Turn: ${activePlayer.name} ${isMyTurn ? "(YOUR TURN)" : ""}`;
    updateDiceDisplay();

    if (gameState.currentRoll > 0 && !gameState.rollAnimationActive) {
      document.getElementById("dice-result").innerText = `🎲 ${gameState.lastRollerName} Rolled: ${gameState.currentRoll}`;
    } else if (gameState.rollAnimationActive) {
      document.getElementById("dice-result").innerText = `🎲 ${gameState.rollAnimationPlayerName || activePlayer.name} is rolling...`;
    } else {
      document.getElementById("dice-result").innerText = `Waiting for ${activePlayer.name} to roll...`;
    }

    document.getElementById("roll-btn").disabled = !(isMyTurn && !gameState.hasRolled && !gameState.rollAnimationActive);

    if (isMyTurn && gameState.hasRolled) {
      renderCoinPicker(activePlayer);
    } else {
      document.getElementById("coin-picker").innerHTML = "";
    }
  }

  function renderCoinPicker(p) {
    const pickerDiv = document.getElementById("coin-picker");
    pickerDiv.innerHTML = "";

    p.coins.forEach((pathIdx, coinIdx) => {
      const btn = document.createElement("button");
      btn.className = "coin-btn";

      const projectedIdx = pathIdx + gameState.currentRoll;

      if (pathIdx === PATH_END_IDX) {
        btn.innerText = `Coin ${coinIdx + 1} (Finished)`;
        btn.disabled = true;
      } else if (!p.hasCut && projectedIdx > OUTER_RING_MAX_IDX) {
        btn.innerText = `Coin ${coinIdx + 1} (Blocked - Need Capture)`;
        btn.disabled = true;
      } else {
        btn.innerText = `Move Coin ${coinIdx + 1}`;
        btn.onclick = () => selectCoinToMove(coinIdx);
      }
      pickerDiv.appendChild(btn);
    });
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const x = col * CELL_SIZE;
        const y = row * CELL_SIZE;
        const cellId = row * GRID_SIZE + col;

        ctx.strokeStyle = "#5d4037";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

        if (SAFE_SQUARES.includes(cellId)) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + CELL_SIZE, y + CELL_SIZE);
          ctx.moveTo(x + CELL_SIZE, y);
          ctx.lineTo(x, y + CELL_SIZE);
          ctx.strokeStyle = "#d7ccc8";
          ctx.stroke();
        }
      }
    }

    if (!gameState || !gameState.players) return;

    gameState.players.forEach((p) => {
      const basePos = BASE_PLAYERS[p.seatIdx].labelPos;
      ctx.fillStyle = p.color === "#fdd835" ? "#f57f17" : p.color;
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = basePos.align;
      ctx.textBaseline = "middle";
      ctx.fillText(p.name, basePos.x, basePos.y);
    });

    const cellOccupants = {};
    gameState.players.forEach((p, pIdx) => {
      p.coins.forEach((pathIdx, coinIdx) => {
        const cellId = PLAYER_PATHS[p.seatIdx][pathIdx];
        if (!cellOccupants[cellId]) cellOccupants[cellId] = [];
        cellOccupants[cellId].push({ 
          player: p, 
          pTag: `P${pIdx + 1}`, 
          coinNum: coinIdx + 1 
        });
      });
    });

    for (const [cellId, occupants] of Object.entries(cellOccupants)) {
      const col = cellId % GRID_SIZE;
      const row = Math.floor(cellId / GRID_SIZE);
      const cellCenterX = col * CELL_SIZE + CELL_SIZE / 2;
      const cellCenterY = row * CELL_SIZE + CELL_SIZE / 2;

      const pGroups = {};
      occupants.forEach(occ => {
        const pid = occ.player.id;
        if (!pGroups[pid]) {
          pGroups[pid] = { 
            player: occ.player, 
            pTag: occ.pTag, 
            coinNums: [] 
          };
        }
        pGroups[pid].coinNums.push(occ.coinNum);
      });

      const uniquePlayers = Object.values(pGroups);
      const numPlayers = uniquePlayers.length;

      uniquePlayers.forEach((group, idx) => {
        let cx = cellCenterX;
        let cy = cellCenterY;
        let radius = CELL_SIZE / 4;

        if (numPlayers === 2) {
          radius = CELL_SIZE / 4.2;
          const shift = CELL_SIZE / 5.2;
          cx += (idx === 0 ? -shift : shift);
          cy += (idx === 0 ? -shift : shift);
        } else if (numPlayers >= 3) {
          radius = CELL_SIZE / 5.2;
          const shift = CELL_SIZE / 5.5;
          cx += (idx % 2 === 0 ? -shift : shift);
          cy += (idx < 2 ? -shift : shift);
        } else {
          if (group.coinNums.length > 1) radius = CELL_SIZE / 3.4;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = group.player.color;
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = group.player.hasCut ? "#FFD700" : "#3e2723";
        ctx.stroke();

        const sortedCoins = group.coinNums.sort((a, b) => a - b).join(",");
        const labelText = numPlayers >= 3 ? `${group.pTag}:${sortedCoins}` : `${group.pTag}:C${sortedCoins}`;

        ctx.fillStyle = group.player.color === "#fdd835" ? "#000" : "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (labelText.length > 8) {
          ctx.font = "bold 6.5px sans-serif";
        } else if (labelText.length > 6) {
          ctx.font = "bold 7.5px sans-serif";
        } else {
          ctx.font = "bold 8.5px sans-serif";
        }

        ctx.fillText(labelText, cx, cy);
      });
    }
  }

  function buildRoomLink(roomCode = currentRoomCode) {
    const url = new URL(window.location.href);
    url.searchParams.set("room", roomCode);
    return url.toString();
  }

  function shareRoomLink() {
    const shareUrl = buildRoomLink(currentRoomCode);
    if (!currentRoomCode) {
      alert("Create or join a room first before sharing the link.");
      return;
    }

    if (navigator.share) {
      navigator.share({
        title: "Join Chowka Bara Game",
        text: `Play Chowka Bara with me! Room Code: ${currentRoomCode}`,
        url: shareUrl
      }).catch(() => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).catch(() => {});
        }
        alert(`Share failed, but you can copy this link manually:\n${shareUrl}`);
      });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert(`Room Link Copied to Clipboard!\n${shareUrl}`);
      }).catch(() => {
        alert(`Copy failed. Please use this link manually:\n${shareUrl}`);
      });
    } else {
      alert(`Use this link to join the room:\n${shareUrl}`);
    }
  }

  function updateMaxPlayers(val) {
    if (!isHost) return;
    gameState.maxPlayers = parseInt(val, 10);
    broadcastState();
  }

  drawBoard();
</script>
