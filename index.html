<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #f3e5ab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #game-info {
      margin-bottom: 6px;
      text-align: center;
    }
    #status { margin: 2px 0; color: #3e2723; font-size: 18px; }
    #dice-result { margin: 2px 0; color: #5d4037; font-size: 15px; font-weight: bold; min-height: 20px; }
    
    .room-panel {
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #efebe9;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #5d4037;
      width: 90vw;
      max-width: 350px;
      box-sizing: border-box;
    }
    .room-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
    }
    .room-row input, .room-row button, .room-row select {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #5d4037;
    }

    .board-container {
      padding: 24px;
      position: relative;
    }

    canvas {
      border: 4px solid #5d4037;
      background: #fff8e7;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      max-width: 82vw;
      max-height: 82vw;
      touch-action: none;
      display: block;
    }
    
    #coin-picker {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
    }
    .coin-btn {
      padding: 8px 12px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 6px;
      border: 2px solid #3e2723;
      background-color: #d7ccc8;
      color: #3e2723;
      cursor: pointer;
    }
    .coin-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn {
      margin-top: 8px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #8d6e63;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px #5d4037;
      cursor: pointer;
    }
    .btn:disabled {
      background-color: #bcaaa4;
      box-shadow: none;
      cursor: not-allowed;
    }
    .action-row {
      display: flex;
      gap: 8px;
    }
  </style>

  <!-- PeerJS Cloud Library (Free P2P WebRTC) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="room-panel" id="lobby-panel">
  <div class="room-row">
    <input type="text" id="player-name" placeholder="Your Name" style="width: 50%;">
    <input type="text" id="room-code-input" placeholder="Room Code" style="width: 45%;">
  </div>

  <!-- Host-Only Mode Control Row -->
  <div class="room-row" id="host-mode-row" style="display: none;">
    <label for="max-players-select" style="color: #3e2723; font-weight: bold; font-size: 13px;">Game Mode:</label>
    <select id="max-players-select" onchange="updateMaxPlayers(this.value)" style="width: 55%;">
      <option value="2">2 Players (Opposite Seats)</option>
      <option value="4" selected>4 Players (All Seats)</option>
    </select>
  </div>

  <div class="room-row" style="justify-content: center; gap: 8px;">
    <button id="host-btn" onclick="hostGame()" style="background:#8d6e63; color:#fff;">Host Game 👑</button>
    <button id="join-btn" onclick="joinGame()" style="background:#d7ccc8; color:#3e2723;">Join Game 🚪</button>
    <button id="share-btn" onclick="shareRoomLink()" style="display: none; background:#2e7d32; color:#fff;">Share Link 🔗</button>
  </div>
</div>

<div id="game-info">
  <h2 id="status">Host or Join a game!</h2>
  <h3 id="dice-result">Waiting for room connection...</h3>
</div>

<div class="board-container">
  <canvas id="board" width="350" height="350"></canvas>
</div>

<div id="coin-picker"></div>

<div class="action-row">
  <button id="start-btn" class="btn" onclick="startGame()" style="display: none; background-color: #2e7d32;">Start Game 🚀</button>
  <button id="roll-btn" class="btn" onclick="requestRoll()" disabled>Roll Shells 🎲</button>
  <button id="restart-btn" class="btn" onclick="requestRestart()" style="display: none; background-color: #c62828;">Restart 🔄</button>
</div>

<script>
  const myDeviceId = window.AndroidBridge 
    ? window.AndroidBridge.getDeviceId() 
    : "DEV_" + Math.random().toString(36).substring(2, 9);

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  const GRID_SIZE = 5;
  const CELL_SIZE = canvas.width / GRID_SIZE;
  const SAFE_SQUARES = [2, 10, 12, 14, 22];
  const OUTER_RING_MAX_IDX = 15;
  const PATH_END_IDX = 24;

  const PLAYER_PATHS = {
    0: [ 2, 1, 0, 5,10,15,20,21,22,23,24,19,14, 9, 4, 3,   7, 8,13,18,17,16,11, 6, 12],
    1: [10,15,20,21,22,23,24,19,14, 9, 4, 3, 2, 1, 0, 5,  11, 6, 7, 8,13,18,17,16, 12],
    2: [22,23,24,19,14, 9, 4, 3, 2, 1, 0, 5,10,15,20,21,  17,16,11, 6, 7, 8,13,18, 12],
    3: [14, 9, 4, 3, 2, 1, 0, 5,10,15,20,21,22,23,24,19,  13,18,17,16,11, 6, 7, 8, 12]
  };

  const BASE_PLAYERS = [
    { id: 0, color: "#e53935", labelPos: { x: 175, y: 372, align: "center" } }, // P1 (Bottom)
    { id: 1, color: "#fdd835", labelPos: { x: -16, y: 175, align: "right" } },  // P2 (Left)
    { id: 2, color: "#1e88e5", labelPos: { x: 175, y: -16, align: "center" } }, // P3 (Top)
    { id: 3, color: "#43a047", labelPos: { x: 366, y: 175, align: "left" } }    // P4 (Right)
  ];

  let peer = null;
  let isHost = false;
  let connections = [];
  let hostConn = null;
  let currentRoomCode = "";

  // Master Game State
  let gameState = {
    status: "lobby", // "lobby", "in_progress", "won"
    maxPlayers: 4,   // 2 or 4
    players: [],
    currentPlayerIdx: 0,
    currentRoll: 0,
    hasRolled: false,
    lastRollerName: ""
  };

  window.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get("room");
    
    if (roomParam) {
      document.getElementById("room-code-input").value = roomParam;
      document.getElementById("host-btn").style.display = "none";
      document.getElementById("status").innerText = `Room ${roomParam} loaded! Enter your name and click Join Game.`;
    }
  });

  function hostGame() {
    isHost = true;
    const name = document.getElementById("player-name").value.trim() || "Host";
    currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById("room-code-input").value = currentRoomCode;

    document.getElementById("host-mode-row").style.display = "flex";
    document.getElementById("host-btn").style.display = "none";
    document.getElementById("join-btn").style.display = "none";
    document.getElementById("share-btn").style.display = "inline-block";

    peer = new Peer("CHOWKA_" + currentRoomCode);

    peer.on("open", () => {
      gameState.players.push({
        id: 0,
        seatIdx: 0,
        deviceId: myDeviceId,
        name: name,
        color: BASE_PLAYERS[0].color,
        coins: [0, 0, 0, 0],
        hasCut: false
      });

      document.getElementById("start-btn").style.display = "inline-block";
      document.getElementById("restart-btn").style.display = "inline-block";
      
      broadcastState();
    });

    peer.on("connection", (conn) => {
      conn.on("data", (data) => handleHostIncomingData(conn, data));
    });
  }

  function shareRoomLink() {
    const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
    if (navigator.share) {
      navigator.share({
        title: "Join Chowka Bara Game",
        text: `Play Chowka Bara with me! Room Code: ${currentRoomCode}`,
        url: shareUrl
      }).catch(() => {});
    } else {
      navigator.clipboard.writeText(shareUrl);
      alert(`Room Link Copied to Clipboard!\n${shareUrl}`);
    }
  }

  function updateMaxPlayers(val) {
    if (!isHost) return;
    gameState.maxPlayers = parseInt(val, 10);
    broadcastState();
  }

  function joinGame() {
    isHost = false;
    const name = document.getElementById("player-name").value.trim() || "Player";
    const roomCode = document.getElementById("room-code-input").value.trim();

    if (!roomCode) {
      alert("Enter a Room Code!");
      return;
    }

    document.getElementById("host-btn").style.display = "none";
    document.getElementById("join-btn").disabled = true;

    peer = new Peer();
    peer.on("open", () => {
      hostConn = peer.connect("CHOWKA_" + roomCode);

      hostConn.on("open", () => {
        hostConn.send({ type: "JOIN_REQUEST", name: name, deviceId: myDeviceId });
      });

      hostConn.on("data", (data) => {
        if (data.type === "SYNC_STATE") {
          gameState = data.state;
          drawBoard();
          updateUI();
        } else if (data.type === "REJECTED") {
          alert(data.reason);
          document.getElementById("join-btn").disabled = false;
        }
      });
    });
  }

  function handleHostIncomingData(conn, data) {
    if (data.type === "JOIN_REQUEST") {
      if (gameState.status !== "lobby") {
        conn.send({ type: "REJECTED", reason: "Game already in progress! You cannot join now." });
        return;
      }
      if (gameState.players.length >= gameState.maxPlayers) {
        conn.send({ type: "REJECTED", reason: `Room is full (${gameState.maxPlayers}-Player mode)!` });
        return;
      }

      const pCount = gameState.players.length;
      const seatIdx = (gameState.maxPlayers === 2 && pCount === 1) ? 2 : pCount;

      gameState.players.push({
        id: pCount,
        seatIdx: seatIdx,
        deviceId: data.deviceId,
        name: data.name,
        color: BASE_PLAYERS[seatIdx].color,
        coins: [0, 0, 0, 0],
        hasCut: false
      });

      connections.push(conn);
      broadcastState();
    } 
    else if (data.type === "ACTION_ROLL") {
      if (gameState.status === "in_progress" && gameState.players[gameState.currentPlayerIdx].deviceId === data.deviceId) {
        executeRoll();
      }
    } 
    else if (data.type === "ACTION_MOVE") {
      if (gameState.status === "in_progress" && gameState.players[gameState.currentPlayerIdx].deviceId === data.deviceId) {
        executeMove(data.coinIdx);
      }
    }
  }

  function startGame() {
    if (!isHost) return;
    
    if (gameState.players.length < gameState.maxPlayers) {
      alert(`Waiting for ${gameState.maxPlayers} players to join before starting!`);
      return;
    }

    gameState.status = "in_progress";
    gameState.currentPlayerIdx = 0;
    gameState.hasRolled = false;
    gameState.currentRoll = 0;
    gameState.lastRollerName = "";

    document.getElementById("start-btn").style.display = "none";
    document.getElementById("host-mode-row").style.display = "none";
    document.getElementById("share-btn").style.display = "none";
    broadcastState();
  }

  function requestRestart() {
    if (isHost) {
      resetGameData();
    }
  }

  function resetGameData() {
    gameState.status = "lobby";
    gameState.currentPlayerIdx = 0;
    gameState.currentRoll = 0;
    gameState.hasRolled = false;
    gameState.lastRollerName = "";

    gameState.players.forEach(p => {
      p.coins = [0, 0, 0, 0];
      p.hasCut = false;
    });

    if (isHost) {
      document.getElementById("start-btn").style.display = "inline-block";
      document.getElementById("host-mode-row").style.display = "flex";
      document.getElementById("share-btn").style.display = "inline-block";
      broadcastState();
    }
  }

  function broadcastState() {
    drawBoard();
    updateUI();
    const msg = { type: "SYNC_STATE", state: gameState };
    connections.forEach(conn => conn.send(msg));
  }

  function requestRoll() {
    if (gameState.status !== "in_progress") return;

    if (isHost) {
      if (gameState.players[gameState.currentPlayerIdx].deviceId === myDeviceId) {
        executeRoll();
      }
    } else {
      hostConn.send({ type: "ACTION_ROLL", deviceId: myDeviceId });
    }
  }

  function executeRoll() {
    if (gameState.hasRolled) return;

    const dicePool = [1, 2, 3, 4, 8];
    const activePlayer = gameState.players[gameState.currentPlayerIdx];
    
    gameState.currentRoll = dicePool[Math.floor(Math.random() * dicePool.length)];
    gameState.hasRolled = true;
    gameState.lastRollerName = activePlayer.name;

    if (isHost) broadcastState();
  }

  function selectCoinToMove(coinIdx) {
    if (gameState.status !== "in_progress") return;

    if (isHost) {
      if (gameState.players[gameState.currentPlayerIdx].deviceId === myDeviceId) {
        executeMove(coinIdx);
      }
    } else {
      hostConn.send({ type: "ACTION_MOVE", coinIdx: coinIdx, deviceId: myDeviceId });
    }
  }

  function executeMove(coinIdx) {
    const activePlayer = gameState.players[gameState.currentPlayerIdx];
    let extraTurn = false;
    let targetIdx = activePlayer.coins[coinIdx] + gameState.currentRoll;

    if (targetIdx <= PATH_END_IDX) {
      activePlayer.coins[coinIdx] = targetIdx;
      const landingCell = PLAYER_PATHS[activePlayer.seatIdx][targetIdx];

      if (!SAFE_SQUARES.includes(landingCell)) {
        gameState.players.forEach((other) => {
          if (other.id !== activePlayer.id) {
            other.coins.forEach((otherPathIdx, oCoinIdx) => {
              const otherCell = PLAYER_PATHS[other.seatIdx][otherPathIdx];
              if (otherCell === landingCell && otherPathIdx < PATH_END_IDX) {
                other.coins[oCoinIdx] = 0;
                activePlayer.hasCut = true;
                extraTurn = true;
              }
            });
          }
        });
      }
    }

    const hasWon = activePlayer.coins.every(idx => idx === PATH_END_IDX);
    if (hasWon) {
      gameState.status = "won";
      if (isHost) broadcastState();
      return;
    }

    if (gameState.currentRoll === 4 || gameState.currentRoll === 8) {
      extraTurn = true;
    }

    if (!extraTurn) {
      gameState.currentPlayerIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length;
    }

    gameState.currentRoll = 0;
    gameState.hasRolled = false;

    if (isHost) broadcastState();
  }

  function updateUI() {
    if (!gameState.players || gameState.players.length === 0) return;

    const activePlayer = gameState.players[gameState.currentPlayerIdx];
    const isMyTurn = activePlayer ? activePlayer.deviceId === myDeviceId : false;

    if (gameState.status === "lobby") {
      document.getElementById("status").innerText = `Mode: ${gameState.maxPlayers} Players | Joined: ${gameState.players.length}/${gameState.maxPlayers}`;
      document.getElementById("dice-result").innerText = isHost ? "Waiting for players, then press Start!" : "Waiting for Host to start...";
      document.getElementById("roll-btn").disabled = true;
      document.getElementById("coin-picker").innerHTML = "";
      return;
    }

    if (gameState.status === "won") {
      document.getElementById("status").innerText = `🎉 ${activePlayer.name} WINS THE GAME! 🎉`;
      document.getElementById("roll-btn").disabled = true;
      document.getElementById("coin-picker").innerHTML = "";
      return;
    }

    document.getElementById("status").innerText = `Turn: ${activePlayer.name} ${isMyTurn ? "(YOUR TURN)" : ""}`;

    // INFORM ALL PLAYERS OF THE ROLLED NUMBER WITH THE PLAYER'S NAME
    if (gameState.currentRoll > 0) {
      document.getElementById("dice-result").innerText = `🎲 ${gameState.lastRollerName} Rolled: ${gameState.currentRoll}`;
    } else {
      document.getElementById("dice-result").innerText = `Waiting for ${activePlayer.name} to roll...`;
    }

    document.getElementById("roll-btn").disabled = !(isMyTurn && !gameState.hasRolled);

    if (isMyTurn && gameState.hasRolled) {
      renderCoinPicker(activePlayer);
    } else {
      document.getElementById("coin-picker").innerHTML = "";
    }
  }

  function renderCoinPicker(p) {
    const pickerDiv = document.getElementById("coin-picker");
    pickerDiv.innerHTML = "";

    p.coins.forEach((pathIdx, coinIdx) => {
      const btn = document.createElement("button");
      btn.className = "coin-btn";

      const projectedIdx = pathIdx + gameState.currentRoll;

      if (pathIdx === PATH_END_IDX) {
        btn.innerText = `Coin ${coinIdx + 1} (Finished)`;
        btn.disabled = true;
      } else if (!p.hasCut && projectedIdx > OUTER_RING_MAX_IDX) {
        btn.innerText = `Coin ${coinIdx + 1} (Blocked - Need Capture)`;
        btn.disabled = true;
      } else {
        btn.innerText = `Move Coin ${coinIdx + 1}`;
        btn.onclick = () => selectCoinToMove(coinIdx);
      }
      pickerDiv.appendChild(btn);
    });
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const x = col * CELL_SIZE;
        const y = row * CELL_SIZE;
        const cellId = row * GRID_SIZE + col;

        ctx.strokeStyle = "#5d4037";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

        if (SAFE_SQUARES.includes(cellId)) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + CELL_SIZE, y + CELL_SIZE);
          ctx.moveTo(x + CELL_SIZE, y);
          ctx.lineTo(x, y + CELL_SIZE);
          ctx.strokeStyle = "#d7ccc8";
          ctx.stroke();
        }
      }
    }

    if (!gameState || !gameState.players) return;

    gameState.players.forEach((p) => {
      const basePos = BASE_PLAYERS[p.seatIdx].labelPos;
      ctx.fillStyle = p.color === "#fdd835" ? "#f57f17" : p.color;
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = basePos.align;
      ctx.textBaseline = "middle";
      ctx.fillText(p.name, basePos.x, basePos.y);
    });

    const cellOccupants = {};
    gameState.players.forEach((p, pIdx) => {
      p.coins.forEach((pathIdx, coinIdx) => {
        const cellId = PLAYER_PATHS[p.seatIdx][pathIdx];
        if (!cellOccupants[cellId]) cellOccupants[cellId] = [];
        cellOccupants[cellId].push({ 
          player: p, 
          pTag: `P${pIdx + 1}`, 
          coinNum: coinIdx + 1 
        });
      });
    });

    for (const [cellId, occupants] of Object.entries(cellOccupants)) {
      const col = cellId % GRID_SIZE;
      const row = Math.floor(cellId / GRID_SIZE);
      const cellCenterX = col * CELL_SIZE + CELL_SIZE / 2;
      const cellCenterY = row * CELL_SIZE + CELL_SIZE / 2;

      const pGroups = {};
      occupants.forEach(occ => {
        const pid = occ.player.id;
        if (!pGroups[pid]) {
          pGroups[pid] = { 
            player: occ.player, 
            pTag: occ.pTag, 
            coinNums: [] 
          };
        }
        pGroups[pid].coinNums.push(occ.coinNum);
      });

      const uniquePlayers = Object.values(pGroups);
      const numPlayers = uniquePlayers.length;

      uniquePlayers.forEach((group, idx) => {
        let cx = cellCenterX;
        let cy = cellCenterY;
        let radius = CELL_SIZE / 4;

        if (numPlayers === 2) {
          radius = CELL_SIZE / 4.2;
          const shift = CELL_SIZE / 5.2;
          cx += (idx === 0 ? -shift : shift);
          cy += (idx === 0 ? -shift : shift);
        } else if (numPlayers >= 3) {
          radius = CELL_SIZE / 5.2;
          const shift = CELL_SIZE / 5.5;
          cx += (idx % 2 === 0 ? -shift : shift);
          cy += (idx < 2 ? -shift : shift);
        } else {
          if (group.coinNums.length > 1) radius = CELL_SIZE / 3.4;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = group.player.color;
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = group.player.hasCut ? "#FFD700" : "#3e2723";
        ctx.stroke();

        const sortedCoins = group.coinNums.sort((a, b) => a - b).join(",");
        const labelText = numPlayers >= 3 ? `${group.pTag}:${sortedCoins}` : `${group.pTag}:C${sortedCoins}`;

        ctx.fillStyle = group.player.color === "#fdd835" ? "#000" : "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (labelText.length > 8) {
          ctx.font = "bold 6.5px sans-serif";
        } else if (labelText.length > 6) {
          ctx.font = "bold 7.5px sans-serif";
        } else {
          ctx.font = "bold 8.5px sans-serif";
        }

        ctx.fillText(labelText, cx, cy);
      });
    }
  }

  drawBoard();
</script>

</body>
</html>
